name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Source and HDL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ghdl
      - run: make check test-hdl
  homing:
    name: LinuxCNC homing
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y --no-install-recommends linuxcnc-uspace-dev python3 make gcc
      - run: make test-homing
  gate:
    name: CI Gate
    if: always()
    needs: [check, homing]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.check.result }}
          HOMING_RESULT: ${{ needs.homing.result }}
        run: test "$RESULT" = success && test "$HOMING_RESULT" = success
  release:
    name: Publish matched source release
    needs: [gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source archives and unavailable-firmware manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/prepare_release.py --version "${RELEASE_TAG#v}" --output release
      - name: Publish only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag
          --title "CNC-Mesa $RELEASE_TAG"
          --notes-file release/release-notes.md
          release/*.tar.gz release/mesa-release.json release/SHA256SUMS
